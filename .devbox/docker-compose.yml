services:
  db:
    image: 'postgres:17-alpine'
    environment:
      POSTGRES_USER: categorical
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'

  web:
    depends_on:
      - 'db'
    build:
      context: ..
      dockerfile: .devbox/Dockerfile
    env_file:
      - '.env'
    ports:
      - '3000:3000'
    volumes:
      - '..:/app'

